@if (open()) {
  <div class="drawer-backdrop" role="presentation" (click)="cerrar()">
    <div
      #panel
      class="drawer-panel"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      tabindex="-1"
      (keydown)="teclado($event)"
      (click)="$event.stopPropagation()"
    >
      <header class="drawer-header">
        <div>
          @if (eyebrow()) {
            <p class="drawer-eyebrow">{{ eyebrow() }}</p>
          }
          <h2>{{ title() }}</h2>
        </div>

        <button type="button" class="icon-button" aria-label="Cerrar" (click)="cerrar()">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </header>

      <div
        class="drawer-body"
        tabindex="0"
        role="region"
        [attr.aria-label]="'Contenido de ' + title()"
      >
        <ng-content />
      </div>
    </div>
  </div>
}
